name: Serpiente de contribuciones
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0077B6&color_dots=#e0f2fe,#7dd3fc,#22d3ee,#0ea5e9,#1d4ed8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5eead4&color_dots=#0b1f33,#0c4a6e,#0369a1,#0ea5e9,#5eead4
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
